name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Playwright suites in tests/ drive a real API (with Mailpit and an
  # administrator), so they run locally next to bilhanah-BE, not here.
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test -w @bilhanah/contracts
      - run: npm run build
        env:
          # Production builds refuse to run without an API origin.
          VITE_API_URL: https://api.bilhanah.com

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Image names must be lowercase.
      - run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Sign in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests only build; pushes to main also publish, tagged with the commit.
      # The origins are bilhanah.com's; another domain rebuilds through infra/compose.prod.yml in bilhanah-BE.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/bilhanah-dashboard:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://api.bilhanah.com
            VITE_MENU_DOMAIN=bilhanah.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
